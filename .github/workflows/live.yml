# 1D live forward test: every 4 hours (02:15, 06:15, ... UTC). No X quota: reads stored posts only.
# Scores each new pilot-client post from earlier posts only, checks predictions once posts are 48h old.
name: "Live test (1D)"

on:
  schedule:
    - cron: "15 2,6,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seeding-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XPLATFORM_API_KEY: ${{ secrets.XPLATFORM_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Score new pilot posts, evaluate matured ones
        run: uv run --no-sync seeding live

      - name: 3 freeze forecasts for new client posts, judge 48h-old ones
        run: uv run --no-sync seeding forecast-live

      - name: Proof (refresh trust checks)
        run: uv run --no-sync seeding proof

      - name: 3 snapshot live client posts (backup for the hourly job, which GitHub sometimes skips)
        run: uv run --no-sync seeding snapshot || echo "snapshot failed; continuing"

      - name: Export dashboard snapshot
        run: uv run --no-sync seeding export-dashboard

      - name: Save pipeline database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/seeding.duckdb
            ~/.cache/huggingface
          key: seeding-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish snapshot (deployed app updates)
        run: bash scripts/publish_snapshot.sh live
