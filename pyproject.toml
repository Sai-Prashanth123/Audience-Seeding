[project]
name = "seeding"
version = "0.1.0"
description = "Audience seeding for Thought Pilot X clients: segments, seed maps, content performance, and a performance model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "curl-cffi>=0.7",
    "streamlit>=1.40",
    "altair>=5.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
model = ["lightgbm>=4.5", "scipy>=1.13"]

[project.scripts]
seeding = "seeding.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
