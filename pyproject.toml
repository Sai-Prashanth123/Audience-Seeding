[project]
name = "seeding"
version = "0.1.0"
description = "Audience seeding for Thought Pilot X clients: segments, seed maps, content performance, and a performance model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "curl-cffi>=0.7",
    "streamlit>=1.40",
    "altair>=5.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.4"]
model = [
    "catboost>=1.2",
    "lightgbm>=4.5",
    "ngboost>=0.5",
    "scipy>=1.13",
]
serve = [
    "fastembed>=0.4",
    "slack-sdk>=3.30",
]
research = [
    "jax>=0.12.1",
    "numpyro>=0.22.0",
    "pymc>=6.4.0",
    "shap>=0.54.1",
    "umap-learn>=0.6.0",
]

[project.scripts]
seeding = "seeding.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# CPU-only torch everywhere (the embedding model runs on CPU). Without this, Linux CI resolves the
# multi-GB CUDA build of torch plus nvidia-* packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
